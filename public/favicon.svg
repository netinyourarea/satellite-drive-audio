<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1F24" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGradient)" stroke="url(#brandGradient)" stroke-width="2.5" />

  <!-- Radio Dish / Base Circle -->
  <circle cx="24" cy="40" r="4.5" fill="url(#brandGradient)" filter="url(#glow)" />
  <path d="M14 44L24 40L30 26" stroke="url(#brandGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Satellite Signal Waves -->
  <path d="M36 20C41 25 41 33 36 38" stroke="url(#brandGradient)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M43 14C51 22 51 36 43 44" stroke="url(#brandGradient)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
  <path d="M50 8C61 19 61 39 50 50" stroke="url(#brandGradient)" stroke-width="3.5" stroke-linecap="round" opacity="0.5" />
</svg>
